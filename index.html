<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>my콘도맵</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loginGate">
    <img id="loginBanner" src="deamoon.png" alt="CONDO TRAVEL MAP">
    <form id="loginForm">
      <input id="loginId" type="text" placeholder="ID" autocomplete="off" required>
      <input id="loginPw" type="password" placeholder="비밀번호" required>
      <button type="submit">입장</button>
      <p id="loginError" hidden>ID 또는 비밀번호가 틀렸습니다.</p>
    </form>
  </div>

  <div id="topbar">
    <button class="filter-btn active" data-region="all">전체</button>
    <button class="filter-btn" data-region="제주">제주</button>
    <button class="filter-btn" data-region="경기인천">경기인천</button>
    <button class="filter-btn" data-region="서울">서울</button>
    <button class="filter-btn" data-region="충청">충청</button>
    <button class="filter-btn" data-region="전라">전라</button>
    <button class="filter-btn" data-region="경상">경상</button>
  </div>

  <div id="map"></div>

  <button id="foodFloatBtn" aria-label="주변 식당/카페">🍴</button>
  <button id="itineraryFloatBtn" aria-label="일정">📅</button>
  <div id="locateStatus" hidden></div>
  <button id="locateBtn" aria-label="현재 위치로 이동"><span id="locateDot"></span></button>

  <div id="sheet">
    <div id="sheetHandle"></div>
    <input id="searchInput" type="text" placeholder="숙소 이름 검색">
    <div id="sheetList"></div>
  </div>

  <div id="itineraryPanel" hidden>
    <div class="sheetHandle"></div>
    <div id="tripTabs"></div>
    <div id="tripCostSummary" hidden></div>
    <input id="placeSearchInput" type="text" placeholder="장소 검색 (성산일출봉, 협재해수욕장...)">
    <div id="placeSearchResults"></div>
    <div id="dayTabs"></div>
    <button id="aiSuggestBtn" hidden>✨ AI로 주변 추천받기</button>
    <p id="aiSeedNote" hidden>먼저 이 Day에 콘도나 장소를 하나 이상 담아야 AI 추천을 받을 수 있어요.</p>
    <div id="timeline"></div>
  </div>

  <div id="aiDim" hidden></div>
  <div id="aiResults" hidden>
    <div class="sheetHandle"></div>
    <div id="aiResultsHeader">✨ AI 추천</div>
    <div id="aiResultsList"></div>
    <button id="aiResultsClose">닫기</button>
  </div>

  <div id="detailCard" hidden>
    <button id="detailClose">✕</button>
    <div id="detailBody"></div>
  </div>

  <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=c92c6827cc8ac71114d08b8527972208&libraries=services&autoload=false"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
